# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrypticSMP - Survival Multiplayer Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0f0f1e;
            --secondary-dark: #1a1a2e;
            --tertiary-dark: #252542;
            --accent-purple: #6366f1;
            --accent-violet: #8b5cf6;
            --glow-blue: #3b82f6;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2d3748;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            z-index: 1000;
            padding: 1rem 2rem;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent-purple);
        }

        /* Hero Section */
        .hero {
            margin-top: 80px;
            padding: 120px 2rem 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float-reverse 10s ease-in-out infinite;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
            letter-spacing: -2px;
        }

        .glow-text {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-violet), var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.2));
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-violet));
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-purple);
            border: 2px solid var(--accent-purple);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        /* Features Section */
        .features {
            padding: 80px 2rem;
            background: var(--secondary-dark);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 700;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: linear-gradient(135deg, var(--tertiary-dark) 0%, rgba(37, 37, 66, 0.5) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }

        .feature-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 2;
        }

        .feature-card p {
            color: var(--text-muted);
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }

        /* Stats Section */
        .stats {
            padding: 80px 2rem;
            background: var(--primary-dark);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .stat-box {
            padding: 2rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            background: rgba(37, 37, 66, 0.3);
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-purple);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Community Section */
        .community {
            padding: 80px 2rem;
            background: var(--secondary-dark);
            border-top: 1px solid var(--border-color);
        }

        .community-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .community-content p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        /* Footer */
        footer {
            padding: 3rem 2rem;
            background: var(--primary-dark);
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--accent-purple);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent-violet);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            nav {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                margin-top: 100px;
                padding: 60px 1rem 40px;
            }

            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .feature-card {
                padding: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .footer-links {
                gap: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">⚔ CRYPTICSMP</div>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">mc.crypticsmp.com</p>
            <ul class="nav-links">
                <li><a href="#features">Features</a></li>
                <li><a href="#community">Community</a></li>
                <li><a href="#stats">Stats</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>
                Welcome to <span class="glow-text">CrypticSMP</span>
            </h1>
            <p>A tight-knit crew of 12 builders exploring a world of mystery and adventure. Build, collaborate, and create something legendary together.</p>
            <div class="cta-buttons">
                <button class="btn btn-primary" onclick="scrollToSection('#community')">Join Discord</button>
                <button class="btn btn-secondary" onclick="scrollToSection('#features')">Learn More</button>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="features" id="features">
        <h2 class="section-title">Why Choose CrypticSMP?</h2>
        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <h3>No Lag, Pure Fun</h3>
                <p>With only 12 of us, the server runs smooth as butter. No competition for resources, just pure gameplay.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🤝</div>
                <h3>Tight-Knit Crew</h3>
                <p>We're not just players, we're a family. Close friendships and epic collaborations on every build.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">⚙️</div>
                <h3>Quality Plugins</h3>
                <p>Enhanced gameplay with carefully selected plugins. Custom features that improve without breaking vanilla feel.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <h3>Safe & Secure</h3>
                <p>Regular backups and anti-grief protection. Your hard work is always safe and protected.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <h3>Active Admins</h3>
                <p>Responsive admins who care. Quick support and fair enforcement of community guidelines.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌍</div>
                <h3>Endless Exploration</h3>
                <p>Massive world to explore. Discover new lands, hidden treasures, and mysterious biomes.</p>
            </div>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats" id="stats">
        <h2 class="section-title">Server Stats</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-number">12</div>
                <div class="stat-label">Crew Members</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">100%</div>
                <div class="stat-label">Vibe Check Passed</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">∞</div>
                <div class="stat-label">Inside Jokes</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">😎</div>
                <div class="stat-label">Exclusive Access</div>
            </div>
        </div>
    </section>

    <!-- Community Section -->
    <section class="community" id="community">
        <div class="community-content">
            <h2 class="section-title">Our Exclusive Crew</h2>
            <p>CrypticSMP is an invite-only server created and run by <strong style="color: var(--accent-purple);">axoloottn</strong> for a select group of 12 friends who share a passion for creativity and adventure. This is where we build legacies, inside joke monuments, and memories that'll last forever. If you're lucky enough to be invited, you're in for an incredible ride.</p>
            <div class="cta-buttons">
                <button class="btn btn-primary" onclick="alert('Discord invite link: discord.gg/crypticsmp')">Join Discord</button>
                <button class="btn btn-secondary" onclick="alert('Server IP: mc.crypticsmp.com\nVersion: 1.20+')">Server Info</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#features">Features</a>
            <a href="#stats">Stats</a>
            <a href="#community">Community</a>
            <a href="#">Rules</a>
            <a href="#">Contact</a>
        </div>
        <p>&copy; 2024 CrypticSMP. Run by <strong>axoloottn</strong> | Minecraft is a trademark of Mojang Synergies AB</p>
    </footer>

    <script>
        function scrollToSection(sectionId) {
            const element = document.querySelector(sectionId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Add scroll animation for elements
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.feature-card').forEach(card => observer.observe(card));
    </script>
</body>
</html>

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
